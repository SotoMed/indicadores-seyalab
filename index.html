<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seyalab | Panel simple con importación robusta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --line:#dbe3ec; --text:#16202b; --muted:#64748b;
  --navy:#0b3a70; --teal:#0ea5a4; --good:#10b981; --warn:#f59e0b; --bad:#e11d48;
  --shadow:0 10px 24px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1220px;margin:0 auto;padding:20px}
.hidden{display:none!important}
.top{background:linear-gradient(135deg,var(--navy),#134a8d);color:#fff;padding:24px;border-radius:24px;box-shadow:var(--shadow)}
.top h1{font-size:30px;letter-spacing:-.03em}
.top p{margin-top:8px;color:#dbeafe}
.role-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.role-btn,.tab-btn,.ghost-btn,.danger-btn,.save-btn,.download-btn{
  border:none;border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:700
}
.role-btn,.tab-btn,.ghost-btn,.download-btn{background:#fff;color:#0f172a;border:1px solid var(--line)}
.role-btn.active,.tab-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:16px}
.sidebar,.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.sidebar{padding:16px;height:fit-content}
.sidebar h3{font-size:18px}
.sidebar p{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.5}
.tabs{display:grid;gap:8px;margin-top:14px}
.tab-btn{text-align:left}
.panel{padding:18px}
.section-title h2{font-size:26px;letter-spacing:-.03em}
.section-title p{margin-top:6px;color:var(--muted);font-size:14px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#cbd5e1}
.metric.good::before{background:var(--good)}
.metric.warn::before{background:var(--warn)}
.metric.bad::before{background:var(--bad)}
.metric .l{font-size:13px;color:var(--muted)}
.metric .v{margin-top:8px;font-size:30px;font-weight:800}
.metric .s{margin-top:8px;font-size:13px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.card{padding:18px}
.card h3{font-size:20px;letter-spacing:-.02em}
.card p.sub{margin-top:6px;color:var(--muted);font-size:13px}
.form{display:grid;gap:10px;margin-top:14px}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:700;color:#475569}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#0f172a}
textarea{min-height:90px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
input[type="checkbox"]{width:auto}
.save-btn{background:linear-gradient(135deg,var(--teal),#0b8f8e);color:#fff}
.download-btn{background:#eef6ff;border-color:#bfd7f4;color:#0b3a70}
.ghost-btn{background:#fff}
.danger-btn{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
.table-title{margin-top:18px;font-size:18px;font-weight:800}
.table-wrap{margin-top:10px;border:1px solid var(--line);border-radius:18px;overflow:auto;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:#f8fafc}
th,td{padding:12px 12px;text-align:left;border-top:1px solid #eef2f7}
th{border-top:none;font-size:12px;color:#475569;text-transform:uppercase}
.kpi-list{display:grid;gap:10px;margin-top:14px}
.kpi-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.note-box{margin-top:16px;padding:14px;border-radius:16px;background:#f8fafc;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2f7;font-size:12px}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.status-ok{background:#ecfdf5;border:1px solid #bbf7d0;color:#166534}
.status-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
@media (max-width:1000px){
  .layout,.metrics,.grid-2,.grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Panel simple de control Seyalab</h1>
    <p>Sencillo de llenar, rápido de revisar y ahora con importación de inventario mejorada.</p>
    <div class="role-row" id="roleRow"></div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <h3 id="roleName">Perfil</h3>
      <p id="roleDesc">Selecciona un perfil.</p>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="panel" id="main"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL = 'https://miztzgfcglvqvvjjtcyv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Nei-DTUW7PhVnrKHYHCM8g_9aWq7rvb';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const STORAGE_KEY = 'seyalab_simple_inventario_v2';

const roles = {
  director: { label:'Director', desc:'Solo ve el resumen.', tabs:['dashboard'] },
  administrador: { label:'Administrador', desc:'Administra inventario, configuraciones y movimientos.', tabs:['dashboard','pedidos','configurar','inventario','compras','almacen','ventas','cobranza'] },
  almacen: { label:'Almacén', desc:'Revisa pedidos y registra movimientos de almacén.', tabs:['pedidos','almacen'] },
  ventas: { label:'Ventas', desc:'Registra seguimiento comercial y cobranza.', tabs:['ventas','cobranza'] }
};

function hoy(){ return new Date().toISOString().slice(0,10); }
function copiar(v){ return JSON.parse(JSON.stringify(v)); }
function dinero(n){ return '$' + Number(n||0).toLocaleString(); }
function esCerrada(status){ return String(status || '').toLowerCase() === 'cerrada' || String(status || '').toLowerCase() === 'ganada'; }
function pct(a,b){ if(!b) return 0; return Math.round((a/b)*100); }
function diasVencido(fecha){
  const a = new Date(fecha), b = new Date(hoy());
  a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  return Math.floor((b-a)/86400000);
}
function estado(v, bueno=90, medio=75){
  if(v >= bueno) return 'good';
  if(v >= medio) return 'warn';
  return 'bad';
}
function limpiarClave(k){
  return String(k || '')
    .trim()
    .toLowerCase()
    .replaceAll('á','a').replaceAll('é','e').replaceAll('í','i').replaceAll('ó','o').replaceAll('ú','u')
    .replaceAll(' ', '_');
}

const seed = {
  inventory: [
    {id:1,code:'REA-001',product:'Reactivo A',category:'Reactivos',location:'Rack A',initialQty:10,min:5,max:20,provider:'Proveedor A'},
    {id:2,code:'CON-001',product:'Control Hematología',category:'Controles',location:'Rack B',initialQty:8,min:2,max:10,provider:'Proveedor B'}
  ],
  warehouseEntries: [
    {id:1,date:hoy(),supplier:'Proveedor A',product:'Reactivo A',qty:10,sameDay:true}
  ],
  warehouseOutputs: [
    {id:1,date:hoy(),area:'Ventas',product:'Reactivo A',qty:2,doubleCheck:true}
  ],
  counts: [
    {id:1,date:hoy(),zone:'Rack A',systemQty:10,physicalQty:10,corrected24h:true}
  ],
  sales: [
    {id:1,date:hoy(),client:'Laboratorio Vida',type:'Venta',amount:85000,status:'Ganada',followUp48h:true},
    {id:2,date:hoy(),client:'Clínica Central',type:'Cotización',amount:42000,status:'Seguimiento',followUp48h:true}
  ],
  collections: [
    {id:1,invoice:'FAC-001',client:'Laboratorio Vida',amount:85000,dueDate:hoy(),status:'Pendiente',paid:false,contactedBeforeDue:true}
  ],
  orders: [],
  orderDraft: { date:hoy(), client:'', notes:'', items:[] },
  dashboard: {
    visible:['salesAmount','conversion','entriesSameDay','overduePct','itemsCount','criticalItems'],
    notes:[]
  },
  purchaseCalc: {
    productId:'',
    monthlyDemand:'',
    leadDays:'',
    safetyDays:'',
    reviewDays:'',
    result:null
  },
  inventorySearch: '',
  importInfo: null
};

const ADMIN_PASSWORD = '9wkmry1d';
let state = cargar();
let session = { role:'director', tab:'dashboard' };

let syncPollingHandle = null;

function tabNecesitaPedidos(tab){
  return tab === 'pedidos' || tab === 'dashboard';
}

function tabNecesitaAlmacen(tab){
  return tab === 'pedidos' || tab === 'dashboard';
}

function tabNecesitaVentas(tab){
  return tab === 'ventas' || tab === 'dashboard';
}

function tabCargaAlmacen(tab){
  return tab === 'inventario' || tab === 'almacen' || tab === 'compras' || tab === 'pedidos' || tab === 'dashboard';
}

function iniciarAutoSync(){
  detenerAutoSync();
  syncPollingHandle = setInterval(async () => {
    if(tabNecesitaPedidos(session.tab)){
      await cargarPedidosSupabase(true);
    }
    if(tabNecesitaAlmacen(session.tab)){
      await cargarAlmacenSupabase(true);
    }
    if(tabNecesitaVentas(session.tab)){
      await cargarVentasSupabase(true);
    }
  }, 3000);
}

function detenerAutoSync(){
  if(syncPollingHandle){
    clearInterval(syncPollingHandle);
    syncPollingHandle = null;
  }
}

cargarPedidosSupabase();
cargarAlmacenSupabase();
cargarVentasSupabase();
iniciarAutoSync();

window.addEventListener('focus', async () => {
  await cargarPedidosSupabase();
  await cargarAlmacenSupabase();
  await cargarVentasSupabase();
});

function cargar(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return copiar(seed);
    const parsed = JSON.parse(raw);
    return {
      ...copiar(seed),
      ...parsed,
      dashboard: { ...copiar(seed).dashboard, ...(parsed.dashboard || {}) },
      purchaseCalc: { ...copiar(seed).purchaseCalc, ...(parsed.purchaseCalc || {}) },
      orderDraft: { ...copiar(seed).orderDraft, ...(parsed.orderDraft || {}) },
      inventory: Array.isArray(parsed.inventory) ? parsed.inventory : copiar(seed).inventory,
      warehouseEntries: Array.isArray(parsed.warehouseEntries) ? parsed.warehouseEntries : copiar(seed).warehouseEntries,
      warehouseOutputs: Array.isArray(parsed.warehouseOutputs) ? parsed.warehouseOutputs : copiar(seed).warehouseOutputs,
      counts: Array.isArray(parsed.counts) ? parsed.counts : copiar(seed).counts,
      sales: Array.isArray(parsed.sales) ? parsed.sales : copiar(seed).sales,
      collections: Array.isArray(parsed.collections) ? parsed.collections : copiar(seed).collections,
      orders: Array.isArray(parsed.orders) ? parsed.orders : [],
    };
  }catch(e){
    return copiar(seed);
  }
}
function guardar(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function inventarioConStock(){
  const entradas = state.warehouseEntries || [];
  const salidas = state.warehouseOutputs || [];
  return (state.inventory || []).map(item => {
    const itemName = String(item.product || '').trim().toLowerCase();
    const itemId = String(item.id);

    const extra = entradas
      .filter(x => {
        const sameId = x.productId && String(x.productId) === itemId;
        const sameName = String(x.product || '').trim().toLowerCase() === itemName;
        return sameId || sameName;
      })
      .reduce((a,b)=>a+Number(b.qty||0),0);

    const resta = salidas
      .filter(x => {
        const sameId = x.productId && String(x.productId) === itemId;
        const sameName = String(x.product || '').trim().toLowerCase() === itemName;
        return sameId || sameName;
      })
      .reduce((a,b)=>a+Number(b.qty||0),0);

    const stock = Number(item.initialQty||0) + extra - resta;
    const critical = stock <= Number(item.min||0);
    return {...item, stock, critical};
  });
}


function stockDisponible(productId){
  const inv = inventarioConStock();
  const item = inv.find(x => String(x.id) === String(productId));
  return item ? Number(item.stock || 0) : 0;
}

function nombreProducto(productId){
  const item = (state.inventory || []).find(x => String(x.id) === String(productId));
  return item ? item.product : '';
}

function siguienteFolioPedido(){
  const list = state.orders || [];
  return 'PED-' + String(list.length + 1).padStart(3,'0');
}


function serializarPedidoNotes(texto, items){
  return JSON.stringify({
    text: texto || '',
    items: Array.isArray(items) ? items : []
  });
}

function deserializarPedidoNotes(notes){
  try{
    const parsed = JSON.parse(notes || '{}');
    return {
      text: parsed.text || '',
      items: Array.isArray(parsed.items) ? parsed.items : []
    };
  }catch(err){
    return {
      text: notes || '',
      items: []
    };
  }
}

async function cargarPedidosSupabase(shouldRender = true){
  try{
    const { data, error } = await supabaseClient
      .from('orders')
      .select('*')
      .order('id', { ascending: false });

    if(error){
      console.error('Error cargando pedidos desde Supabase:', error);
      return;
    }

    state.orders = (data || []).map(row => {
      const parsed = deserializarPedidoNotes(row.notes);
      return {
        id: row.id,
        folio: row.folio,
        date: row.order_date,
        client: row.client,
        notes: parsed.text || '',
        status: row.status || 'Pendiente almacén',
        items: parsed.items || []
      };
    });

    if(shouldRender && (session.tab === 'pedidos' || session.tab === 'dashboard')){
      renderMain();
    }
  }catch(err){
    console.error('Error general cargando pedidos:', err);
  }
}

async function guardarPedidoSupabase(order){
  const payload = {
    folio: order.folio,
    order_date: order.date,
    client: order.client,
    notes: serializarPedidoNotes(order.notes, order.items),
    status: order.status || 'Pendiente almacén',
    created_by: session.role,
    invoiced: false
  };

  const { data, error } = await supabaseClient
    .from('orders')
    .insert(payload)
    .select()
    .single();

  if(error) throw error;
  return data;
}

async function actualizarPedidoSupabase(orderId, changes){
  const payload = { ...changes };

  if(Object.prototype.hasOwnProperty.call(changes, 'date')){
    payload.order_date = changes.date;
    delete payload.date;
  }

  if(Object.prototype.hasOwnProperty.call(changes, 'notes') || Object.prototype.hasOwnProperty.call(changes, 'items')){
    const current = (state.orders || []).find(x => Number(x.id) === Number(orderId)) || {};
    payload.notes = serializarPedidoNotes(
      Object.prototype.hasOwnProperty.call(changes, 'notes') ? changes.notes : current.notes,
      Object.prototype.hasOwnProperty.call(changes, 'items') ? changes.items : current.items
    );
    delete payload.items;
  }

  const { error } = await supabaseClient
    .from('orders')
    .update(payload)
    .eq('id', orderId);

  if(error) throw error;
}



async function cargarAlmacenSupabase(shouldRender = true){
  try{
    const invRes = await supabaseClient
      .from('inventory')
      .select('*')
      .order('id', { ascending: true });

    if(invRes.error){
      console.error('Error cargando inventario desde Supabase:', invRes.error);
      return;
    }

    state.inventory = (invRes.data || []).map(row => ({
      id: row.id,
      code: row.code || '',
      product: row.product || '',
      category: row.category || '',
      location: row.location || '',
      initialQty: Number(row.initial_qty || 0),
      min: Number(row.min_qty || 0),
      max: Number(row.max_qty || 0),
      provider: row.provider || ''
    }));

    const [entriesRes, outputsRes] = await Promise.all([
      supabaseClient.from('warehouse_entries').select('*').order('id', { ascending: false }),
      supabaseClient.from('warehouse_outputs').select('*').order('id', { ascending: false })
    ]);

    if(entriesRes.error){
      console.error('Error cargando entradas desde Supabase:', entriesRes.error);
    } else {
      state.warehouseEntries = (entriesRes.data || []).map(row => {
        const productRow = state.inventory.find(x => Number(x.id) === Number(row.product_id));
        return {
          id: row.id,
          date: row.movement_date,
          supplier: row.supplier || '',
          productId: row.product_id ? String(row.product_id) : '',
          product: productRow ? productRow.product : '',
          qty: Number(row.qty || 0),
          sameDay: !!row.same_day
        };
      });
    }

    if(outputsRes.error){
      console.error('Error cargando salidas desde Supabase:', outputsRes.error);
    } else {
      state.warehouseOutputs = (outputsRes.data || []).map(row => {
        const productRow = state.inventory.find(x => Number(x.id) === Number(row.product_id));
        return {
          id: row.id,
          date: row.movement_date,
          area: row.area || '',
          reference: row.reference || '',
          productId: row.product_id ? String(row.product_id) : '',
          product: productRow ? productRow.product : '',
          qty: Number(row.qty || 0),
          doubleCheck: !!row.double_check
        };
      });
    }

    if(shouldRender && tabCargaAlmacen(session.tab)){
      renderMain();
    }
  }catch(err){
    console.error('Error general cargando almacén:', err);
  }
}

async function insertarProductoSupabase(item){
  const cleanCode = String(item.code || '').trim() || null;
  const payload = {
    code: cleanCode,
    product: String(item.product || '').trim(),
    category: item.category || null,
    location: item.location || null,
    initial_qty: Number(item.initialQty || 0),
    min_qty: Number(item.min || 0),
    max_qty: Number(item.max || 0),
    provider: item.provider || null,
    active: true
  };

  if(cleanCode){
    const { data, error } = await supabaseClient
      .from('inventory')
      .upsert(payload, { onConflict: 'code' })
      .select()
      .single();
    if(error) throw error;
    return data;
  }

  const { data, error } = await supabaseClient
    .from('inventory')
    .insert(payload)
    .select()
    .single();
  if(error) throw error;
  return data;
}

async function actualizarProductoSupabase(id, changes){
  const payload = {};
  if(Object.prototype.hasOwnProperty.call(changes, 'code')) payload.code = changes.code || null;
  if(Object.prototype.hasOwnProperty.call(changes, 'product')) payload.product = changes.product || '';
  if(Object.prototype.hasOwnProperty.call(changes, 'category')) payload.category = changes.category || null;
  if(Object.prototype.hasOwnProperty.call(changes, 'location')) payload.location = changes.location || null;
  if(Object.prototype.hasOwnProperty.call(changes, 'initialQty')) payload.initial_qty = Number(changes.initialQty || 0);
  if(Object.prototype.hasOwnProperty.call(changes, 'min')) payload.min_qty = Number(changes.min || 0);
  if(Object.prototype.hasOwnProperty.call(changes, 'max')) payload.max_qty = Number(changes.max || 0);
  if(Object.prototype.hasOwnProperty.call(changes, 'provider')) payload.provider = changes.provider || null;

  const { error } = await supabaseClient
    .from('inventory')
    .update(payload)
    .eq('id', id);
  if(error) throw error;
}

async function borrarRegistroSupabase(tabla, id){
  const { error } = await supabaseClient.from(tabla).delete().eq('id', id);
  if(error) throw error;
}

async function registrarEntradaSupabase(entry){
  const { error } = await supabaseClient.from('warehouse_entries').insert({
    movement_date: entry.date,
    supplier: entry.supplier || null,
    product_id: entry.productId ? Number(entry.productId) : null,
    qty: Number(entry.qty || 0),
    same_day: !!entry.sameDay,
    created_by: session.role
  });
  if(error) throw error;
}

async function registrarSalidaSupabase(output){
  const { error } = await supabaseClient.from('warehouse_outputs').insert({
    movement_date: output.date,
    area: output.area || null,
    reference: output.reference || null,
    product_id: output.productId ? Number(output.productId) : null,
    qty: Number(output.qty || 0),
    double_check: !!output.doubleCheck,
    created_by: session.role
  });
  if(error) throw error;
}



async function cargarVentasSupabase(shouldRender = true){
  try{
    const { data, error } = await supabaseClient
      .from('sales')
      .select('*')
      .order('id', { ascending: false });

    if(error){
      console.error('Error cargando ventas desde Supabase:', error);
      return;
    }

    state.sales = (data || []).map(row => ({
      id: row.id,
      date: row.sale_date,
      client: row.client || '',
      seller: row.seller || 'Vendedor 1',
      contact: row.contact || '',
      type: row.sale_type || '',
      amount: Number(row.amount || 0),
      status: row.status || 'Seguimiento',
      nextFollowUp: row.next_follow_up || '',
      priority: row.priority || '',
      notes: row.notes || '',
      followUp48h: !!row.follow_up_48h
    }));

    if(shouldRender && tabNecesitaVentas(session.tab)){
      renderMain();
    }
  }catch(err){
    console.error('Error general cargando ventas:', err);
  }
}

async function guardarVentaSupabase(item){
  const payload = {
    sale_date: item.date || hoy(),
    client: item.client || '',
    seller: item.seller || 'Vendedor 1',
    contact: item.contact || null,
    sale_type: item.type || null,
    amount: Number(item.amount || 0),
    status: item.status || 'Seguimiento',
    next_follow_up: item.nextFollowUp || null,
    priority: item.priority || null,
    notes: item.notes || null,
    follow_up_48h: !!item.followUp48h
  };

  const { data, error } = await supabaseClient
    .from('sales')
    .insert(payload)
    .select()
    .single();

  if(error) throw error;
  return data;
}


function metricas(){
  const inv = inventarioConStock();
  const cerradas = state.sales.filter(x => esCerrada(x.status));
  const ventasMonto = cerradas.reduce((a,b)=>a+Number(b.amount||0),0);
  const conversion = pct(cerradas.length, state.sales.length || 1);
  const entradasDia = pct(state.warehouseEntries.filter(x=>x.sameDay).length, state.warehouseEntries.length || 1);
  const abiertas = state.collections.filter(x=>!x.paid);
  const vencidas = abiertas.filter(x=>diasVencido(x.dueDate)>0);
  const vencidaPct = pct(vencidas.length, abiertas.length || 1);

  return {
    salesAmount:{label:'Ventas del mes',value:dinero(ventasMonto),sub:'Monto cerrado',status:'good'},
    conversion:{label:'Conversión',value:conversion+'%',sub:'Cerradas vs registradas',status:estado(conversion,35,20)},
    entriesSameDay:{label:'Entradas al día',value:entradasDia+'%',sub:'Registro el mismo día',status:estado(entradasDia,95,80)},
    overduePct:{label:'Cobranza vencida',value:vencidaPct+'%',sub:'Facturas abiertas vencidas',status:vencidaPct<=10?'good':vencidaPct<=25?'warn':'bad'},
    itemsCount:{label:'Productos cargados',value:String(inv.length),sub:'Inventario maestro',status:'good'},
    criticalItems:{label:'Productos críticos',value:String(inv.filter(x=>x.critical).length),sub:'Stock en mínimo o menos',status:inv.filter(x=>x.critical).length>0?'warn':'good'}
  };
}

function render(){
  renderRoles();
  renderTabs();
  renderMain();
}

function renderRoles(){
  const row = document.getElementById('roleRow');
  row.innerHTML = Object.entries(roles).map(([key,role]) =>
    `<button class="role-btn ${session.role===key?'active':''}" data-role="${key}">${role.label}</button>`
  ).join('');
  row.querySelectorAll('[data-role]').forEach(btn=>{
    btn.onclick = () => {
      const nextRole = btn.dataset.role;
      if(nextRole === 'administrador' && session.role !== 'administrador'){
        const pass = window.prompt('Contraseña de administrador:');
        if(pass === null){
          return;
        }
        if(String(pass).trim() !== ADMIN_PASSWORD){
          alert('Contraseña incorrecta.');
          return;
        }
      }
      session.role = nextRole;
      session.tab = roles[session.role].tabs[0];
      render();
    };
  });
}

function renderTabs(){
  const role = roles[session.role];
  document.getElementById('roleName').textContent = role.label;
  document.getElementById('roleDesc').textContent = role.desc;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = role.tabs.map(tab =>
    `<button class="tab-btn ${session.tab===tab?'active':''}" data-tab="${tab}">${tab.charAt(0).toUpperCase()+tab.slice(1)}</button>`
  ).join('');
  tabs.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.onclick = async () => {
      session.tab = btn.dataset.tab;
      if(tabNecesitaPedidos(session.tab)){
        await cargarPedidosSupabase(false);
      }
      if(tabCargaAlmacen(session.tab)){
        await cargarAlmacenSupabase(false);
      }
      if(tabNecesitaVentas(session.tab)){
        await cargarVentasSupabase(false);
      }
      renderMain();
      renderTabs();
    };
  });
}

function cardMetric(m){
  return `<div class="metric ${m.status}"><div class="l">${m.label}</div><div class="v">${m.value}</div><div class="s">${m.sub}</div></div>`;
}

function tabla(cols,rows){
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.length===0 ? `<tr><td colspan="${cols.length}" style="text-align:center;color:#64748b">Sin datos</td></tr>` :
            rows.map(r=>`<tr>${cols.map(c=>`<td>${c.render?c.render(r[c.key],r):(r[c.key]??'')}</td>`).join('')}</tr>`).join('')
          }
        </tbody>
      </table>
    </div>`;
}

function renderMain(){

function vistaCompras(){
  const inv = inventarioConStock();
  const calc = state.purchaseCalc || {productId:'',monthlyDemand:'',leadDays:'',safetyDays:'',reviewDays:'',result:null};
  const selected = inv.find(x => String(x.id) === String(calc.productId));

  const underMin = inv.filter(x => Number(x.min || 0) > 0 && Number(x.stock || 0) <= Number(x.min || 0));
  const withoutConfig = inv.filter(x => Number(x.min || 0) === 0 && Number(x.max || 0) === 0);
  const suggested = inv
    .map(x => {
      const stock = Number(x.stock || 0);
      const min = Number(x.min || 0);
      const max = Number(x.max || 0);
      const reorderQty = max > stock ? Math.max(0, max - stock) : 0;
      return {
        ...x,
        reorderQty,
        buyNow: min > 0 && stock <= min
      };
    })
    .filter(x => x.buyNow || x.reorderQty > 0)
    .sort((a,b) => {
      if(a.buyNow !== b.buyNow) return a.buyNow ? -1 : 1;
      return Number(b.reorderQty || 0) - Number(a.reorderQty || 0);
    });

  const totalSuggestedUnits = suggested.reduce((acc, item) => acc + Number(item.reorderQty || 0), 0);

  return `

      <h2>Compras</h2>
      <p>Define máximos y mínimos, detecta faltantes y genera compras sugeridas para almacén.</p>

      ${cardMetric({label:'Bajo mínimo',value:String(underMin.length),sub:'Productos que ya piden compra',status:underMin.length>0?'warn':'good'})}
      ${cardMetric({label:'Unidades sugeridas',value:String(totalSuggestedUnits),sub:'Compra estimada para reponer',status:totalSuggestedUnits>0?'warn':'good'})}
      ${cardMetric({label:'Sin configuración',value:String(withoutConfig.length),sub:'Productos sin mínimo y máximo',status:withoutConfig.length>0?'warn':'good'})}
      ${cardMetric({label:'Productos revisados',value:String(inv.length),sub:'Base para compras',status:'good'})}
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card" style="padding:18px;border:none;box-shadow:none">
          <h3>Calculadora de máximos y mínimos</h3>
          <p class="sub">Llenas los datos y el sistema te propone el mínimo y el máximo.</p>
          <form id="purchaseCalcForm" class="form">
            <div class="field">
              <label>Producto</label>
              <select name="productId">
                <option value="">Selecciona un producto</option>
                ${inv.map(x => `<option value="${x.id}" ${String(calc.productId)===String(x.id)?'selected':''}>${x.product}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Consumo promedio mensual</label><input type="number" step="any" name="monthlyDemand" value="${calc.monthlyDemand || ''}" placeholder="Ej. 30"></div>
            <div class="field"><label>Tiempo de entrega en días</label><input type="number" step="any" name="leadDays" value="${calc.leadDays || ''}" placeholder="Ej. 10"></div>
            <div class="field"><label>Días de seguridad</label><input type="number" step="any" name="safetyDays" value="${calc.safetyDays || ''}" placeholder="Ej. 5"></div>
            <div class="field"><label>Días de revisión</label><input type="number" step="any" name="reviewDays" value="${calc.reviewDays || ''}" placeholder="Ej. 15"></div>
            <button class="save-btn" type="submit">Calcular</button>
          </form>

          <div class="note-box">
            <b>Fórmulas:</b><br><br>
            Consumo diario = Consumo mensual / 30<br>
            Mínimo = Consumo diario × (Tiempo de entrega + Días de seguridad)<br>
            Máximo = Mínimo + (Consumo diario × Días de revisión)
          </div>
        </div>

      <div class="card">
        <div class="card" style="padding:18px;border:none;box-shadow:none">
          <h3>Resultado</h3>
          <p class="sub">Propuesta sugerida para compras</p>

          ${calc.result ? `

              ${cardMetric({label:'Máximo sugerido',value:String(calc.result.maxSuggested),sub:'Tope recomendado',status:'good'})}

function descargarPlantillaCSV(){
  const rows = [
    ['codigo','producto','categoria','ubicacion','existencia_inicial','minimo','maximo','proveedor'],
    ['REA-001','Reactivo A','Reactivos','Rack A',10,5,20,'Proveedor A'],
    ['CON-001','Control Hematología','Controles','Rack B',8,2,10,'Proveedor B']
  ];
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plantilla_inventario_seyalab.csv';
  a.click();
}

function attachEvents(){
  const main = document.getElementById('main');

  const refreshOrdersBtn = main.querySelector('#refreshOrdersBtn');
  if(refreshOrdersBtn) refreshOrdersBtn.onclick = async ()=>{
    await cargarPedidosSupabase();
  };

  const refreshInventoryBtn = main.querySelector('#refreshInventoryBtn');
  if(refreshInventoryBtn) refreshInventoryBtn.onclick = async ()=>{
    await cargarAlmacenSupabase();
  };

  const noteForm = main.querySelector('#noteForm');
  if(noteForm){
    noteForm.onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(noteForm);
      state.dashboard.notes.unshift({id:Date.now(),title:fd.get('title'),text:fd.get('text')});
      guardar(); renderMain();
    };
  }

  main.querySelectorAll('[data-del-note]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.delNote);
      state.dashboard.notes = state.dashboard.notes.filter(n=>n.id!==id);
      guardar(); renderMain();
    };
  });

  main.querySelectorAll('[data-kpi]').forEach(chk=>{
    chk.onchange = ()=>{
      const id = chk.dataset.kpi;
      let arr = state.dashboard.visible || [];
      if(chk.checked){
        if(!arr.includes(id)) arr.push(id);
      }else{
        arr = arr.filter(x=>x!==id);
      }
      state.dashboard.visible = arr;
      guardar(); renderMain();
    };
  });

  main.querySelectorAll('[data-remove-kpi]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.removeKpi;
      state.dashboard.visible = (state.dashboard.visible || []).filter(x=>x!==id);
      guardar(); renderMain();
    };
  });

  const inventorySearch = main.querySelector('#inventorySearch');
  if(inventorySearch) inventorySearch.oninput = (e)=>{
    const value = e.target.value || '';
    const start = e.target.selectionStart;
    const end = e.target.selectionEnd;
    const scrollY = window.scrollY;
    state.inventorySearch = value;
    guardar();
    renderMain();
    const searchAgain = document.getElementById('inventorySearch');
    if(searchAgain){
      searchAgain.focus();
      try{ searchAgain.setSelectionRange(start, end); }catch(err){}
    }
    window.scrollTo(0, scrollY);
  };

  const inventoryForm = main.querySelector('#inventoryForm');
  if(inventoryForm) inventoryForm.onsubmit = async (e)=>{
    e.preventDefault();
    detenerAutoSync();
    if(session.role !== 'administrador'){
      alert('Solo el administrador puede dar de alta productos en inventario.');
      return;
    }
    try{
      const fd = new FormData(inventoryForm);
      await insertarProductoSupabase({
        code: fd.get('code'),
        product: fd.get('product'),
        category: fd.get('category'),
        location: fd.get('location'),
        initialQty: Number(fd.get('initialQty')||0),
        min: Number(fd.get('min')||0),
        max: Number(fd.get('max')||0),
        provider: fd.get('provider')
      });
      state.importInfo = {rowsRead:1, imported:1, skipped:0, message:'Producto agregado en base compartida.'};
      await cargarAlmacenSupabase(false);
      guardar(); renderMain();
      alert('Producto guardado en Supabase.');
    }catch(err){
      console.error(err);
      alert('No se pudo guardar el producto en Supabase.');
    }finally{
      iniciarAutoSync();
    }
  };

  const downloadTemplateBtn = main.querySelector('#downloadTemplateBtn');
  if(downloadTemplateBtn) downloadTemplateBtn.onclick = descargarPlantillaCSV;

  const importForm = main.querySelector('#importForm');
  if(importForm) importForm.onsubmit = (e)=>{
    e.preventDefault();
    detenerAutoSync();
    if(session.role !== 'administrador'){
      alert('Solo el administrador puede importar inventario.');
      return;
    }
    const fileInput = document.getElementById('inventoryFile');
    const file = fileInput.files[0];
    const replace = document.getElementById('replaceInventory').checked;
    if(!file){
      alert('Selecciona un archivo primero.');
      return;
    }
    if(typeof XLSX === 'undefined'){
      alert('No se cargó la librería de Excel. Abre el archivo con internet o exporta tu archivo como CSV.');
      return;
    }
    const reader = new FileReader();
    reader.onload = async function(evt){
      try{
        const wb = file.name.toLowerCase().endsWith('.csv')
          ? XLSX.read(evt.target.result, {type:'binary'})
          : XLSX.read(evt.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];

        // Leer todo como matriz para poder encontrar la fila real de encabezados
        const matrix = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});

        function norm(v){
          return String(v || '')
            .trim()
            .toLowerCase()
            .replaceAll('á','a').replaceAll('é','e').replaceAll('í','i').replaceAll('ó','o').replaceAll('ú','u')
            .replaceAll('  ',' ')
            .replaceAll('.','')
            .replaceAll(' ','_');
        }

        // Buscar una fila que tenga encabezados tipo inventario
        let headerRowIndex = -1;
        for(let i=0; i<matrix.length; i++){
          const row = (matrix[i] || []).map(norm);
          const hasArticulo = row.includes('articulo') || row.includes('codigo') || row.includes('code');
          const hasExistencia = row.includes('existencia') || row.includes('existencia_inicial') || row.includes('cantidad') || row.includes('stock');
          if(hasArticulo && hasExistencia){
            headerRowIndex = i;
            break;
          }
        }

        if(headerRowIndex === -1){
          state.importInfo = {
            rowsRead: matrix.length,
            imported: 0,
            skipped: matrix.length,
            message: 'No encontré una fila de encabezados válida. Tu archivo debe tener columnas como Artículo / Existencia o codigo / producto.'
          };
          guardar();
          renderMain();
          alert('No encontré la fila correcta de encabezados en el archivo.');
          return;
        }

        const header = (matrix[headerRowIndex] || []).map(norm);
        const dataRows = matrix.slice(headerRowIndex + 1);

        // Mapa por posición
        const idxCode = header.findIndex(h => ['codigo','code','articulo','sku','item'].includes(h));
        const idxProduct = header.findIndex(h => ['producto','descripcion','articulo','columna2','product'].includes(h));
        const idxCategory = header.findIndex(h => ['categoria','category','familia'].includes(h));
        const idxLocation = header.findIndex(h => ['ubicacion','location','rack','anaquel'].includes(h));
        const idxQty = header.findIndex(h => ['existencia','existencia_inicial','cantidad','stock'].includes(h));
        const idxMin = header.findIndex(h => ['minimo','min'].includes(h));
        const idxMax = header.findIndex(h => ['maximo','max'].includes(h));
        const idxProvider = header.findIndex(h => ['proveedor','provider'].includes(h));

        let imported = 0;
        let skipped = 0;

        const usedCodes = new Set();
        const nuevos = dataRows.map((row, idx) => {
          const rawProduct = idxProduct >= 0 ? row[idxProduct] : '';
          const rawCode = idxCode >= 0 ? row[idxCode] : '';
          const qty = idxQty >= 0 ? row[idxQty] : 0;

          const product = String(rawProduct || rawCode || '').trim();
          let code = String(rawCode || '').trim();

          // Saltar filas vacías
          if(!product && !code){
            skipped++;
            return null;
          }

          // Si no hay código, generar uno estable para evitar choques y permitir importar
          if(!code){
            const base = product
              .toUpperCase()
              .replace(/[^A-Z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 24) || 'ITEM';
            code = 'IMP-' + base + '-' + String(idx + 1).padStart(4, '0');
          }

          // Si viene repetido en el mismo archivo, agregar sufijo
          let finalCode = code;
          let suffix = 2;
          while(usedCodes.has(finalCode)){
            finalCode = code + '-' + suffix;
            suffix++;
          }
          usedCodes.add(finalCode);

          imported++;
          return {
            id: Date.now() + idx + Math.floor(Math.random()*100000),
            code: finalCode,
            product: product,
            category: idxCategory >= 0 ? String(row[idxCategory] || '').trim() : '',
            location: idxLocation >= 0 ? String(row[idxLocation] || '').trim() : '',
            initialQty: Number(qty || 0),
            min: idxMin >= 0 ? Number(row[idxMin] || 0) : 0,
            max: idxMax >= 0 ? Number(row[idxMax] || 0) : 0,
            provider: idxProvider >= 0 ? String(row[idxProvider] || '').trim() : ''
          };
        }).filter(Boolean);

        try{
          if(nuevos.length === 0){
            alert('No se encontraron productos válidos para importar.');
            return;
          }

          if(replace){
            // Reemplazo total del inventario maestro actual.
            for(const item of [...state.inventory]){
              await borrarRegistroSupabase('inventory', item.id);
            }
          }

          for(const item of nuevos){
            await insertarProductoSupabase(item);
          }

          await cargarAlmacenSupabase(false);
          state.importInfo = {
            rowsRead: dataRows.length,
            imported,
            skipped,
            message: 'Encabezados detectados en la fila ' + (headerRowIndex + 1) + '. Inventario enviado correctamente a Supabase.'
          };
          guardar();
          renderMain();
          alert('Importación terminada. Importados: ' + imported + ' | Omitidos: ' + skipped);
        }catch(syncErr){
          console.error(syncErr);
          alert('Se leyó el archivo, pero no se pudo guardar el inventario en Supabase. Revisa si el archivo trae datos repetidos o vacíos.');
        }finally{
          iniciarAutoSync();
        }
      }catch(err){
        state.importInfo = {
          rowsRead:0,
          imported:0,
          skipped:0,
          message:'No se pudo leer el archivo. Si sigue fallando, guarda tu Excel como CSV y vuelve a importarlo.'
        };
        guardar();
        renderMain();
        alert('No se pudo importar el archivo. Si sigue fallando, guárdalo como CSV.');
        iniciarAutoSync();
      }
    };
    if(file.name.toLowerCase().endsWith('.csv')){
      reader.readAsBinaryString(file);
    }else{
      reader.readAsArrayBuffer(file);
    }
  };


  const purchaseCalcForm = main.querySelector('#purchaseCalcForm');
  if(purchaseCalcForm) purchaseCalcForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(purchaseCalcForm);
    const monthlyDemand = Number(fd.get('monthlyDemand') || 0);
    const leadDays = Number(fd.get('leadDays') || 0);
    const safetyDays = Number(fd.get('safetyDays') || 0);
    const reviewDays = Number(fd.get('reviewDays') || 0);
    const dailyDemand = +(monthlyDemand / 30).toFixed(2);
    const safetyStock = +(dailyDemand * safetyDays).toFixed(2);
    const minSuggested = Math.ceil(dailyDemand * (leadDays + safetyDays));
    const maxSuggested = Math.ceil(minSuggested + (dailyDemand * reviewDays));
    state.purchaseCalc = {
      productId: fd.get('productId'),
      monthlyDemand: fd.get('monthlyDemand'),
      leadDays: fd.get('leadDays'),
      safetyDays: fd.get('safetyDays'),
      reviewDays: fd.get('reviewDays'),
      result: { dailyDemand, safetyStock, minSuggested, maxSuggested }
    };
    guardar(); renderMain();
  };

  const applyMinMaxBtn = main.querySelector('#applyMinMaxBtn');
  if(applyMinMaxBtn) applyMinMaxBtn.onclick = async ()=>{
    const calc = state.purchaseCalc || {};
    if(!calc.productId || !calc.result){
      alert('Primero calcula los valores.');
      return;
    }
    try{
      await actualizarProductoSupabase(calc.productId, {
        min: Number(calc.result.minSuggested || 0),
        max: Number(calc.result.maxSuggested || 0)
      });
      await cargarAlmacenSupabase(false);
      guardar();
      renderMain();
      alert('Mínimo y máximo aplicados al producto.');
    }catch(err){
      console.error(err);
      alert('No se pudo actualizar el producto en Supabase.');
    }
  };



  const addOrderItemBtn = main.querySelector('#addOrderItemBtn');
  if(addOrderItemBtn) addOrderItemBtn.onclick = ()=>{
    if(session.role !== 'administrador'){
      alert('Solo administración puede capturar pedidos.');
      return;
    }
    const form = document.getElementById('orderDraftForm');
    const fd = new FormData(form);
    const productId = String(fd.get('productId') || '').trim();
    const qty = Number(fd.get('qty') || 0);
    if(!productId || qty <= 0){
      alert('Selecciona producto y cantidad.');
      return;
    }
    const product = nombreProducto(productId);
    state.orderDraft = {
      date: fd.get('date') || hoy(),
      client: fd.get('client') || '',
      notes: fd.get('notes') || '',
      items: [...((state.orderDraft && Array.isArray(state.orderDraft.items)) ? state.orderDraft.items : []), { productId, product, qty }]
    };
    guardar();
    renderMain();
    alert('Partida agregada al pedido.');
  };

  const orderDraftForm = main.querySelector('#orderDraftForm');
  if(orderDraftForm) orderDraftForm.onsubmit = async (e)=>{
    e.preventDefault();
    if(session.role !== 'administrador'){
      alert('Solo administración puede guardar pedidos.');
      return;
    }

    try{
      const fd = new FormData(orderDraftForm);
      const client = String(fd.get('client') || '').trim();
      const date = fd.get('date') || hoy();
      const notes = fd.get('notes') || '';

      let draftItems = [...((state.orderDraft && Array.isArray(state.orderDraft.items)) ? state.orderDraft.items : [])];

      const currentProductId = String(fd.get('productId') || '').trim();
      const currentQty = Number(fd.get('qty') || 0);
      if(currentProductId && currentQty > 0){
        const alreadyExistsSameLine = draftItems.some(it =>
          String(it.productId) === currentProductId && Number(it.qty) === currentQty
        );
        if(!alreadyExistsSameLine){
          draftItems.push({
            productId: currentProductId,
            product: nombreProducto(currentProductId),
            qty: currentQty
          });
        }
      }

      if(!client){
        alert('Captura el cliente.');
        return;
      }
      if(draftItems.length === 0){
        alert('Agrega al menos una partida o selecciona producto y cantidad.');
        return;
      }

      const orderToSave = {
        folio: siguienteFolioPedido(),
        date: date,
        client: client,
        notes: notes,
        status: 'Pendiente almacén',
        items: draftItems
      };

      await guardarPedidoSupabase(orderToSave);
      state.orderDraft = { date:hoy(), client:'', notes:'', items:[] };
      await cargarPedidosSupabase();
      guardar();
      renderMain();
      alert('Pedido guardado en Supabase.');
    }catch(err){
      console.error(err);
      alert('No se pudo guardar el pedido en Supabase.');
    }
  };

  main.querySelectorAll('[data-del-draft-item]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.delDraftItem);
      if(!state.orderDraft || !Array.isArray(state.orderDraft.items)) state.orderDraft = { date:hoy(), client:'', notes:'', items:[] };
      state.orderDraft.items = (state.orderDraft.items || []).filter((_,i)=>i!==idx);
      guardar();
      renderMain();
    };
  });

  main.querySelectorAll('[data-review-order]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = Number(btn.dataset.reviewOrder);
      const order = (state.orders || []).find(x => Number(x.id) === id);
      if(!order) return;
      const complete = order.items.every(it => stockDisponible(it.productId) >= Number(it.qty));
      const newStatus = complete ? 'Listo para surtir' : 'Incompleto';
      try{
        await actualizarPedidoSupabase(id, { status: newStatus });
        await cargarPedidosSupabase();
        guardar();
        renderMain();
      }catch(err){
        console.error(err);
        alert('No se pudo actualizar el pedido en Supabase.');
      }
    };
  });

  main.querySelectorAll('[data-pack-order]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = Number(btn.dataset.packOrder);
      const order = (state.orders || []).find(x => Number(x.id) === id);
      if(!order) return;
      const complete = order.items.every(it => stockDisponible(it.productId) >= Number(it.qty));
      if(!complete){
        alert('No hay suficiente inventario para empacar completo este pedido.');
        return;
      }
      try{
        for(const it of order.items){
          await registrarSalidaSupabase({
            date: hoy(),
            area: 'Pedido ' + order.folio,
            reference: order.folio,
            productId: it.productId,
            qty: Number(it.qty || 0),
            doubleCheck: true
          });
        }
        await actualizarPedidoSupabase(id, { status:'Empacado' });
        await cargarAlmacenSupabase(false);
        await cargarPedidosSupabase();
        guardar();
        renderMain();
      }catch(err){
        console.error(err);
        alert('No se pudo empacar el pedido en Supabase.');
      }
    };
  });

  main.querySelectorAll('[data-invoice-order]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = Number(btn.dataset.invoiceOrder);
      try{
        await actualizarPedidoSupabase(id, { status:'Facturado', invoiced:true });
        await cargarPedidosSupabase();
        guardar();
        renderMain();
      }catch(err){
        console.error(err);
        alert('No se pudo marcar como facturado en Supabase.');
      }
    };
  });

  main.querySelectorAll('[data-cancel-order]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = Number(btn.dataset.cancelOrder);
      try{
        await actualizarPedidoSupabase(id, { status:'Cancelado' });
        await cargarPedidosSupabase();
        guardar();
        renderMain();
      }catch(err){
        console.error(err);
        alert('No se pudo cancelar el pedido en Supabase.');
      }
    };
  });


  const entryForm = main.querySelector('#entryForm');
  if(entryForm) entryForm.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(entryForm);

    let productId = String(fd.get('productId') || '').trim();
    let productName = String(fd.get('product') || '').trim();
    const supplier = String(fd.get('supplier') || '').trim();
    const category = String(fd.get('category') || '').trim();
    const location = String(fd.get('location') || '').trim();

    try{
      if(productId){
        const invItem = (state.inventory || []).find(x => String(x.id) === productId);
        if(invItem){
          productName = invItem.product;
        }
      }

      if(!productId && productName){
        const existing = (state.inventory || []).find(x =>
          String(x.product || '').trim().toLowerCase() === productName.toLowerCase()
        );
        if(existing){
          productId = String(existing.id);
          productName = existing.product;
        }
      }

      if(!productId && productName){
        const codeBase = productName
          .toUpperCase()
          .replace(/[^A-Z0-9]+/g,' ')
          .trim()
          .split(' ')
          .slice(0,2)
          .join('-') || 'PROD';

        const saved = await insertarProductoSupabase({
          code:'AUTO-' + codeBase,
          product:productName,
          category: category || 'Sin categoría',
          location: location || 'Sin ubicación',
          initialQty:0,
          min:0,
          max:0,
          provider:supplier || ''
        });
        productId = String(saved.id);
      }

      await registrarEntradaSupabase({
        date: fd.get('date'),
        supplier: supplier,
        productId: productId || '',
        qty: Number(fd.get('qty')||0),
        sameDay: !!fd.get('sameDay')
      });

      await cargarAlmacenSupabase(false);
      guardar();
      renderMain();
      alert('Entrada registrada en Supabase.');
    }catch(err){
      console.error(err);
      alert('No se pudo registrar la entrada en Supabase.');
    }
  };

  const outputForm = main.querySelector('#outputForm');
  if(outputForm) outputForm.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(outputForm);
    let productId = String(fd.get('productId') || '').trim();
    let productName = String(fd.get('product') || '').trim();

    try{
      if(productId){
        const invItem = (state.inventory || []).find(x => String(x.id) === String(productId));
        if(invItem){
          productName = invItem.product;
        }
      }

      if(!productId && productName){
        const existing = (state.inventory || []).find(x =>
          String(x.product || '').trim().toLowerCase() === productName.toLowerCase()
        );
        if(existing){
          productId = String(existing.id);
        }
      }

      if(!productId){
        alert('Selecciona un producto del inventario o escribe uno que ya exista.');
        return;
      }

      await registrarSalidaSupabase({
        date: fd.get('date'),
        area: fd.get('area'),
        productId: productId || '',
        qty: Number(fd.get('qty')||0),
        doubleCheck: !!fd.get('doubleCheck')
      });

      await cargarAlmacenSupabase(false);
      guardar();
      renderMain();
      alert('Salida registrada en Supabase.');
    }catch(err){
      console.error(err);
      alert('No se pudo registrar la salida en Supabase.');
    }
  };

  const countForm = main.querySelector('#countForm');
  if(countForm) countForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(countForm);
    state.counts.unshift({
      id:Date.now(),
      date:fd.get('date'),
      zone:fd.get('zone'),
      systemQty:Number(fd.get('systemQty')||0),
      physicalQty:Number(fd.get('physicalQty')||0),
      corrected24h:!!fd.get('corrected24h')
    });
    guardar(); renderMain();
  };

  const salesForm = main.querySelector('#salesForm');
  if(salesForm) salesForm.onsubmit = async (e)=>{
    e.preventDefault();
    try{
      const fd = new FormData(salesForm);
      await guardarVentaSupabase({
        date: fd.get('date'),
        client: fd.get('client'),
        seller: fd.get('seller') || 'Vendedor 1',
        contact: fd.get('contact'),
        type: fd.get('type'),
        amount: Number(fd.get('amount')||0),
        status: fd.get('status'),
        nextFollowUp: fd.get('nextFollowUp'),
        priority: fd.get('priority'),
        notes: fd.get('notes'),
        followUp48h: !!fd.get('followUp48h')
      });
      await cargarVentasSupabase(false);
      guardar();
      renderMain();
      alert('Venta guardada en Supabase.');
    }catch(err){
      console.error(err);
      alert('No se pudo guardar la venta en Supabase.');
    }
  };

  const colForm = main.querySelector('#colForm');
  if(colForm) colForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(colForm);
    state.collections.unshift({
      id:Date.now(),
      invoice:fd.get('invoice'),
      client:fd.get('client'),
      amount:Number(fd.get('amount')||0),
      dueDate:fd.get('dueDate'),
      status:fd.get('status'),
      paid:!!fd.get('paid'),
      contactedBeforeDue:!!fd.get('contactedBeforeDue')
    });
    guardar(); renderMain();
  };

  main.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = Number(btn.dataset.id);
      const type = btn.dataset.del;
      try{
        if(type==='inventory'){
          if(session.role !== 'administrador'){
            alert('Solo el administrador puede borrar productos del inventario.');
            return;
          }
          await borrarRegistroSupabase('inventory', id);
          await cargarAlmacenSupabase(false);
        } else if(type==='entry'){
          await borrarRegistroSupabase('warehouse_entries', id);
          await cargarAlmacenSupabase(false);
        } else if(type==='output'){
          await borrarRegistroSupabase('warehouse_outputs', id);
          await cargarAlmacenSupabase(false);
        } else if(type==='count'){
          state.counts = state.counts.filter(x=>x.id!==id);
        } else if(type==='sale'){
          await borrarRegistroSupabase('sales', id);
          await cargarVentasSupabase(false);
        } else if(type==='collection'){
          state.collections = state.collections.filter(x=>x.id!==id);
        }
        guardar();
        renderMain();
      }catch(err){
        console.error(err);
        alert('No se pudo borrar el registro en Supabase.');
      }
    };
  });
}

Promise.all([cargarPedidosSupabase(false), cargarAlmacenSupabase(false), cargarVentasSupabase(false)]).finally(() => {
  render();
});
</script>
</body>
</html>
